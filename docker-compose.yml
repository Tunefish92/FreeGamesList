services:
  # Website: serves every visitor from the local database, never calls external APIs.
  web:
    build: .
    image: freegameslist:latest
    container_name: freegameslist-web
    ports:
      - "3000:3000"
    volumes:
      - data:/data
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
      - /app/.next/cache:mode=1777
    depends_on:
      - worker
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health?web"]
      interval: 30s
      timeout: 5s
      start_period: 20s

  # Cron worker: fetches all sources once a day and rebuilds the snapshots in the database.
  worker:
    build: .
    image: freegameslist:latest
    container_name: freegameslist-worker
    command: ["node", "worker.mjs"]
    volumes:
      - data:/data
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    environment:
      - CRON_SCHEDULE=0 15 * * *   # daily at 15:00
      - TZ=Europe/Berlin
      - RETRY_ATTEMPTS=3           # retries for failed sources …
      - RETRY_DELAY_MIN=10         # … every 10 minutes
      # - UPDATE_REGIONS=DE,AT,CH  # limit regions (default: all 15)
      # - STEAM_FREE_LIMIT=1000
      # - STEAM_DLC_LIMIT=200

volumes:
  data:
